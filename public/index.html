<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Porto Santos Live</title><link rel="manifest" href="/manifest.json"><style>
:root{--blue:#07376d;--bg:#f3f6fa;--card:#fff;--line:#dfe6ef;--muted:#63748a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:#10233f}header{background:linear-gradient(135deg,#052b56,#0878d1);color:#fff;padding:25px 18px}.wrap{max-width:1250px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.top h1{margin:0;font-size:27px}.top p{margin:5px 0;opacity:.8}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.push{background:#fff;color:#07589f}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff22;padding:13px;border-radius:12px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;opacity:.8}main{padding:20px 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px}input,select{padding:11px;border:1px solid var(--line);border-radius:9px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted)}.badge{padding:5px 8px;border-radius:99px;background:#eaf1fa;font-size:11px;font-weight:800}.green{background:#e3f7ee;color:#087a51}.orange{background:#fff0dc;color:#a96400}.blue{background:#e4f0ff;color:#075ea9}.meta{font-size:12px;color:var(--muted)}@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="wrap"><div class="top"><div><h1>⚓ Porto Santos — Live</h1><p>Chegada • Barra • Atracação</p></div><button id="push" class="btn push">🔔 Ativar notificações</button></div><div class="stats"><div class="stat"><b id="total">0</b><span>Navios</span></div><div class="stat"><b id="esperados">0</b><span>Esperados</span></div><div class="stat"><b id="barra">0</b><span>Na barra</span></div><div class="stat"><b id="atracados">0</b><span>Atracados</span></div></div></div></header><main class="wrap"><div class="card"><div class="toolbar"><input id="q" placeholder="🔎 Buscar navio, viagem ou IMO"><select id="st"><option value="">Todos os status</option><option>Esperado</option><option>Programado</option><option>Fundeado</option><option>Na barra</option><option>Atracado</option></select><select id="src"><option value="">Todas as fontes</option><option value="APS">APS</option><option value="Santos Brasil">Santos Brasil</option></select><button class="btn" onclick="load()">↻ Atualizar</button></div><p class="meta" id="info">Carregando dados oficiais…</p></div><div class="card scroll"><table><thead><tr><th>Navio / viagem</th><th>Status</th><th>Berço</th><th>ETA — chegada</th><th>ATA — barra</th><th>ETB — prevista</th><th>ATB — atracação</th><th>Fonte</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
let all=[];const $=id=>document.getElementById(id);
async function load(){try{const d=await(await fetch('/api/navios')).json();all=d.navios||[];render();$('info').textContent=`Última coleta: ${d.updatedAt?new Date(d.updatedAt).toLocaleString('pt-BR'):'aguardando'} • ${d.count||0} registros`;}catch(e){$('info').textContent='Erro ao consultar o servidor.'}}
function render(){let q=$('q').value.toLowerCase(),s=$('st').value,src=$('src').value;let a=all.filter(n=>(!q||JSON.stringify(n).toLowerCase().includes(q))&&(!s||n.status===s)&&(!src||n.source.includes(src)));a.sort((x,y)=>(x.eta||'').localeCompare(y.eta||''));$('rows').innerHTML=a.map(n=>`<tr><td><b>${n.name||'—'}</b><br><span class="meta">${n.voyage||''}${n.imo?' • IMO '+n.imo:''}</span></td><td><span class="badge ${n.status==='Atracado'?'green':n.status==='Na barra'?'orange':'blue'}">${n.status||'—'}</span></td><td>${n.berco||'—'}</td><td>${n.eta||'—'}</td><td>${n.ata||'—'}</td><td>${n.etb||'—'}</td><td>${n.atb||'—'}</td><td class="meta">${n.source||'—'}</td></tr>`).join('')||'<tr><td colspan="8">Nenhum navio encontrado.</td></tr>'; $('total').textContent=all.length;$('esperados').textContent=all.filter(n=>n.status==='Esperado').length;$('barra').textContent=all.filter(n=>n.status==='Na barra').length;$('atracados').textContent=all.filter(n=>n.status==='Atracado').length}
async function push(){if(!('serviceWorker'in navigator)||!('PushManager'in window))return alert('Este navegador não suporta Push.');let c=await(await fetch('/api/config')).json();if(!c.pushEnabled)return alert('O administrador ainda precisa configurar as chaves VAPID no Render.');let reg=await navigator.serviceWorker.register('/sw.js'),p=await Notification.requestPermission();if(p!=='granted')return;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(c.publicKey)});await fetch('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub)});$('push').textContent='🔔 Notificações ativas'}
function b64(s){let r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
$('push').onclick=push;$('q').oninput=render;$('st').onchange=render;$('src').onchange=render;load();setInterval(load,60000);
</script></body></html>
