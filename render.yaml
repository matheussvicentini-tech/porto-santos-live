services:
  - type: web
    name: porto-santos-live
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: porto-santos-db
          property: connectionString
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

databases:
  - name: porto-santos-db
    plan: basic-256mb
